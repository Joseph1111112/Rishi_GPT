<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rishi GPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gemini: { bg: '#f8fafd', darkBg: '#131314', sidebar: '#f0f4f9', darkSidebar: '#1e1e20', card: '#ffffff', darkCard: '#282a2c' } } } } }</script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>.app-height { height: 100vh; height: 100dvh; }</style>
</head>
<body class="h-full bg-gemini-bg dark:bg-gemini-darkBg text-gray-800 dark:text-gray-100 font-sans antialiased overflow-hidden">
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gemini-darkBg text-xl font-semibold">Loading Rishi GPT...</div>
    <div class="app-height flex overflow-hidden">
        <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-gemini-sidebar dark:bg-gemini-darkSidebar flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 border-r dark:border-gray-800">
            <div class="p-4 flex gap-2"><button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-gemini-darkCard py-3 px-4 rounded-full border dark:border-gray-700 shadow-sm"><i data-lucide="plus" class="w-5 h-5 text-blue-500"></i><span class="text-sm font-medium">New Chat</span></button><button onclick="toggleSidebar(false)" class="md:hidden p-2"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div class="flex-1 overflow-y-auto px-3 space-y-1" id="chat-list"></div>
            <div class="p-3 border-t dark:border-gray-800 space-y-1">
                <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-gray-200/60 dark:hover:bg-gray-800"><i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i><span id="theme-text">Dark Theme</span></button>
                <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-gray-200/60 dark:hover:bg-gray-800"><i data-lucide="settings" class="w-4 h-4"></i><span>Settings</span></button>
            </div>
        </aside>
        <main class="flex-1 flex flex-col h-full bg-white dark:bg-gemini-darkBg overflow-hidden">
            <header class="flex items-center justify-between px-4 py-3 border-b dark:border-gray-800 md:border-none">
                <div class="flex items-center gap-3"><button onclick="toggleSidebar(true)" class="md:hidden p-2"><i data-lucide="menu" class="w-5 h-5"></i></button><h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-red-500 bg-clip-text text-transparent">Rishi GPT</h1></div>
                <div class="text-xs text-gray-400 font-mono" id="current-model-tag">deepseek/deepseek-r1:free</div>
            </header>
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl mx-auto w-full"></div>
            <div class="p-3 md:p-4 border-t dark:border-gray-800">
                <form onsubmit="handleSend(event)" class="max-w-4xl mx-auto flex items-end bg-gemini-sidebar dark:bg-gemini-darkCard rounded-3xl p-2">
                    <textarea id="user-input" rows="1" placeholder="Message Rishi GPT..." class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none resize-none max-h-36" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&window.innerWidth>=768){event.preventDefault();handleSend(event);}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,144)+'px';"></textarea>
                    <button type="submit" id="send-btn" class="p-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white rounded-full ml-1"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
                </form>
            </div>
        </main>
    </div>
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gemini-darkCard rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-semibold border-b pb-2 dark:border-gray-700">Settings</h3>
            <div><label class="text-xs font-semibold uppercase">API Key</label><input type="password" id="api-key-input" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gemini-darkSidebar border rounded-lg dark:border-gray-600"></div>
            <div><label class="text-xs font-semibold uppercase">Model</label><input type="text" id="model-input" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gemini-darkSidebar border rounded-lg dark:border-gray-600"></div>
            <div><label class="text-xs font-semibold uppercase">System Prompt</label><textarea id="system-prompt-input" rows="2" class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gemini-darkSidebar border rounded-lg dark:border-gray-600"></textarea></div>
            <div class="flex justify-end gap-2"><button onclick="closeSettings()" class="px-4 py-2 text-sm">Cancel</button><button onclick="saveSettings()" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg">Save</button></div>
        </div>
    </div>
    <script>
        const DEF_M = 'deepseek/deepseek-r1:free', DEF_S = 'You are Rishi GPT, a helpful AI assistant.';
        let state = { apiKey: localStorage.getItem('r_key')||'', model: localStorage.getItem('r_mod')||DEF_M, systemPrompt: localStorage.getItem('r_sys')||DEF_S, darkMode: localStorage.getItem('r_dark')==='true', chats: JSON.parse(localStorage.getItem('r_chats')||'[]'), currentChatId: null, isGen: false };
        window.addEventListener('DOMContentLoaded', () => { if(!state.chats.length) createNewChat(false); else state.currentChatId = state.chats[0].id; applyTheme(); renderList(); renderMsgs(); document.getElementById('current-model-tag').innerText = state.model; document.getElementById('loading').style.display='none'; });
        function save() { localStorage.setItem('r_key', state.apiKey); localStorage.setItem('r_mod', state.model); localStorage.setItem('r_sys', state.systemPrompt); localStorage.setItem('r_dark', state.darkMode); localStorage.setItem('r_chats', JSON.stringify(state.chats)); }
        function applyTheme() { document.documentElement.classList.toggle('dark', state.darkMode); document.getElementById('theme-text').innerText = state.darkMode ? 'Light Theme' : 'Dark Theme'; document.getElementById('theme-icon').setAttribute('data-lucide', state.darkMode ? 'sun' : 'moon'); lucide.createIcons(); }
        function toggleDarkMode() { state.darkMode = !state.darkMode; applyTheme(); save(); }
        function toggleSidebar(o) { document.getElementById('sidebar').classList.toggle('-translate-x-full', !o); document.getElementById('sidebar-backdrop').classList.toggle('hidden', !o); }
        function createNewChat(sw=true) { const c = { id: Date.now().toString(), title: 'New Chat', messages: [] }; state.chats.unshift(c); if(sw) state.currentChatId = c.id; save(); renderList(); renderMsgs(); if(window.innerWidth<768) toggleSidebar(false); }
        function selectChat(id) { state.currentChatId = id; renderList(); renderMsgs(); if(window.innerWidth<768) toggleSidebar(false); }
        function deleteChat(id, e) { e.stopPropagation(); state.chats = state.chats.filter(c => c.id !== id); if(!state.chats.length) createNewChat(false); else if(state.currentChatId === id) state.currentChatId = state.chats[0].id; save(); renderList(); renderMsgs(); }
        function renameChat(id, e) { e.stopPropagation(); const c = state.chats.find(x => x.id === id); const t = prompt('Rename:', c.title); if(t) { c.title = t; save(); renderList(); } }
        function getChat() { return state.chats.find(c => c.id === state.currentChatId) || state.chats[0]; }
        function renderList() { const l = document.getElementById('chat-list'); l.innerHTML = ''; state.chats.forEach(c => { l.innerHTML += `<div onclick="selectChat('${c.id}')" class="group flex items-center justify-between px-3 py-2 rounded-lg text-sm cursor-pointer ${c.id===state.currentChatId?'bg-blue-100 dark:bg-gray-800 text-blue-500':'hover:bg-gray-200/50 dark:hover:bg-gray-800/50'}"><span class="truncate">${c.title}</span><div class="hidden group-hover:flex gap-1"><button onclick="renameChat('${c.id}',event)"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button><button onclick="deleteChat('${c.id}',event)"><i data-lucide="trash-2" class="w-3.5 h-3.5 text-red-500"></i></button></div></div>`; }); lucide.createIcons(); }
        function renderMsgs() { const mc = document.getElementById('messages-container'), c = getChat(); if(!c.messages.length) { mc.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-center"><h2 class="text-3xl font-bold bg-gradient-to-r from-blue-500 to-red-500 bg-clip-text text-transparent">Hello there</h2><p class="text-gray-400 text-sm">Ask Rishi GPT anything.</p></div>'; return; } mc.innerHTML = ''; c.messages.forEach(m => { mc.innerHTML += `<div class="flex gap-3 ${m.role==='user'?'justify-end':'justify-start'}"><div class="${m.role==='user'?'bg-gray-100 dark:bg-gray-800 px-4 py-3 rounded-2xl max-w-[85%]':'flex gap-3 max-w-[85%]'}">${m.role==='user'?m.content:`<div class="w-7 h-7 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-bold shrink-0">R</div><div class="prose dark:prose-invert">${marked.parse(m.content)}</div>`}</div></div>`; }); mc.scrollTop = mc.scrollHeight; }
        async function handleSend(e) { e.preventDefault(); if(state.isGen) return; const inp = document.getElementById('user-input'), txt = inp.value.trim(); if(!txt) return; if(!state.apiKey) { alert('Set API Key in Settings'); openSettings(); return; } const c = getChat(); if(!c.messages.length) { c.title = txt.slice(0,25); renderList(); } c.messages.push({role:'user', content:txt}); inp.value=''; renderMsgs(); const ai = {role:'assistant', content:''}; c.messages.push(ai); state.isGen=true; try { const res = await fetch('https://openrouter.ai/api/v1/chat/completions', { method:'POST', headers:{'Authorization':`Bearer ${state.apiKey}`,'Content-Type':'application/json'}, body:JSON.stringify({model:state.model, messages:[{role:'system', content:state.systemPrompt}, ...c.messages.slice(0,-1)], stream:true}) }); const reader = res.body.getReader(), dec = new TextDecoder(); let buf=''; while(true) { const {done, value} = await reader.read(); if(done)break; buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop()||''; for(const l of lines) { const t=l.trim(); if(t.startsWith('data: ')) { if(t.slice(6)==='[DONE]')break; try{ai.json=JSON.parse(t.slice(6)); ai.content+=ai.json.choices[0].delta.content||''; renderMsgs();}catch(e){} } } } } catch(err) { ai.content=`Error: ${err.message}`; renderMsgs(); } state.isGen=false; save(); }
        function openSettings() { document.getElementById('api-key-input').value = state.apiKey; document.getElementById('model-input').value = state.model; document.getElementById('system-prompt-input').value = state.systemPrompt; document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() { state.apiKey=document.getElementById('api-key-input').value.trim(); state.model=document.getElementById('model-input').value.trim()||DEF_M; state.systemPrompt=document.getElementById('system-prompt-input').value.trim()||DEF_S; document.getElementById('current-model-tag').innerText=state.model; save(); closeSettings(); }
    </script>
</body>
</html>
